services:
  postgres:
    image: postgres:16-alpine
    container_name: ocp-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ocp_dev
      POSTGRES_USER: ocp
      POSTGRES_PASSWORD: ocp_dev_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ocp -d ocp_dev"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: ocp-api
    ports:
      - "3000:3000"
    environment:
      OCP_DATABASE_URL: postgresql://ocp:ocp_dev_password@postgres:5432/ocp_dev
      OCP_PORT: "3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    container_name: ocp-web
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
