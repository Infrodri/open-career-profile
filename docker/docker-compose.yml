services:
  postgres:
    image: postgres:16-alpine
    container_name: ocp-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ocp_dev
      POSTGRES_USER: ocp
      POSTGRES_PASSWORD: ocp_dev_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
